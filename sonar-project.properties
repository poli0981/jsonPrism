# SonarQube Cloud, CI-based analysis (.github/workflows/ci.yml, job "sonar").
# Automatic Analysis must stay off in the project settings, or the CI scan fails.
sonar.organization=poli0981
sonar.projectKey=poli0981_jsonPrism
sonar.projectName=JSONPrism
sonar.sourceEncoding=UTF-8

# The Android project under src-tauri/gen is Tauri scaffolding; only the files
# we maintain (manifest, Kotlin entry point) are analysed, not its Gradle setup.
sonar.sources=src,worker,src-tauri/src,src-tauri/gen/android/app/src/main,.github/workflows,vite.config.ts,vitest.config.ts
sonar.tests=src,worker
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,src/test/**
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,src/test/**,src/components/ui/**,**/*.d.ts,src-tauri/gen/android/app/src/main/res/**

# Coverage comes from Vitest (npm run test:coverage). Rust, Android and
# workflow files have no JS coverage to report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/i18n/locales/**,src-tauri/**,.github/**,vite.config.ts,vitest.config.ts
sonar.cpd.exclusions=src/i18n/locales/**

# Report the Quality Gate without blocking CI until coverage settles.
sonar.qualitygate.wait=false
