<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0c14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Applies the saved theme + display preferences before first paint (no
      flash of the wrong theme). External and blocking on purpose: an inline
      script would need 'unsafe-inline' in the web CSP, and Tauri hashes inline
      scripts into its CSP, which would disable 'unsafe-inline' for styles.
    -->
    <script src="/theme-init.js"></script>

    <title>JSONPrism · Disperse JSON into 12 formats</title>
    <meta
      name="description"
      content="JSONPrism converts JSON to JSONL, CSV, TSV, YAML, XML, TOML, RESX, Markdown, SQL, BSON, CBOR and MessagePack, reads six of them back, and turns JSONC (JSON with comments) into plain JSON. Conversion runs on your device; batch up to 500 files."
    />
    <meta
      name="keywords"
      content="JSON converter, JSONC to JSON, JSONL, NDJSON, CSV, YAML, XML, TOML, RESX, Markdown table, SQL INSERT, BSON, CBOR, MessagePack, batch, offline"
    />
    <!-- Updated per route by Layout (useCanonicalUrl). -->
    <link rel="canonical" href="https://jsonprism.poli0981.dev/" />

    <!-- Open Graph / link previews (Discord, X, Bluesky) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JSONPrism" />
    <meta property="og:title" content="JSONPrism — Disperse JSON into 12 formats" />
    <meta
      property="og:description"
      content="A refracting tool for developers: one JSON input, twelve target formats, six of them reversible, plus JSONC to JSON. Runs on your device."
    />
    <meta property="og:url" content="https://jsonprism.poli0981.dev/" />
    <meta property="og:image" content="https://jsonprism.poli0981.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JSONPrism — a prism splitting JSON into many formats" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Fonts: Geist (UI + headings) and JetBrains Mono (code), self-hosted via
      @fontsource and imported in src/main.tsx so the app works fully offline
      (desktop + Android) with no third-party font requests.
    -->
  </head>
  <body>
    <noscript>JSONPrism needs JavaScript to convert files in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
