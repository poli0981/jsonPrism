<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Background: deep midnight gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1530" />
      <stop offset="100%" stop-color="#0a0b14" />
    </radialGradient>
    <linearGradient id="ray-v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="ray-c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="ray-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="ray-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Rounded square base (macOS app icon look) -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)" />

  <!-- Incoming white ray -->
  <line x1="60" y1="512" x2="360" y2="512" stroke="#f5f5f5" stroke-width="40" stroke-linecap="round" />

  <!-- Prism triangle -->
  <path
    d="M360 192 L760 512 L360 832 Z"
    fill="rgba(245,245,245,0.04)"
    stroke="#f5f5f5"
    stroke-width="36"
    stroke-linejoin="round"
  />

  <!-- Dispersed rays -->
  <line x1="760" y1="512" x2="980" y2="320" stroke="url(#ray-v)" stroke-width="36" stroke-linecap="round" />
  <line x1="760" y1="512" x2="980" y2="440" stroke="url(#ray-c)" stroke-width="36" stroke-linecap="round" />
  <line x1="760" y1="512" x2="980" y2="584" stroke="url(#ray-a)" stroke-width="36" stroke-linecap="round" />
  <line x1="760" y1="512" x2="980" y2="704" stroke="url(#ray-r)" stroke-width="36" stroke-linecap="round" />
</svg>
