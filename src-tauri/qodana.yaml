# Qodana for Rust (Early Access): Qodana Cloud project "jsonprism-rust".
# Runs in Docker from .github/workflows/qodana.yml (job "rust"), with this
# folder as the project directory and the repository root mounted, so
# tauri::generate_context!() can read ../dist.
version: '1.0'
linter: qodana-rust

# The image ships Rust but no C toolchain or GTK/WebKit headers, so build
# scripts and proc macros can't compile ("linker `cc` not found") and the
# analysis is incomplete. Install what the CI `rust` job installs. This needs
# the container to run as root (--user root in the workflow).
bootstrap: >-
  apt-get update -qq &&
  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
  build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      # Generated by `tauri android init` and the Android build
      - gen
      # Generated by `npm run tauri:icon`
      - icons
      - target
  # serde_json looks unused from src/, but the code tauri::generate_context!()
  # expands to uses ::serde_json, and removing it breaks the build (see the
  # comment in Cargo.toml).
  - name: CargoUnusedDependency
    paths:
      - Cargo.toml
