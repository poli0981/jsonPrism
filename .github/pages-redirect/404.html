<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSONPrism has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://jsonprism.poli0981.dev/" />
    <!-- Without JavaScript, fall back to the new home page. -->
    <meta http-equiv="refresh" content="3; url=https://jsonprism.poli0981.dev/" />
    <script>
      (function () {
        // Drop the old project-site prefix; keep the rest of the path, the query and the hash.
        var path = location.pathname.replace(/^\/jsonprism(?=\/|$)/i, '') || '/';
        location.replace('https://jsonprism.poli0981.dev' + path + location.search + location.hash);
      })();
    </script>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>
      JSONPrism has moved to
      <a href="https://jsonprism.poli0981.dev/">jsonprism.poli0981.dev</a>.
    </p>
  </body>
</html>
