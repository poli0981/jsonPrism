name: Production smoke

# Cloudflare Workers Builds deploys every push to main to
# https://jsonprism.poli0981.dev. This waits until the site serves the pushed
# commit (index.html carries <meta name="jsonprism-commit">), then checks the
# security headers, routing, redirects and the API. Failures reach Discord via
# notify-ci-failure.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  SITE: https://jsonprism.poli0981.dev
  UA: jsonprism-smoke (+https://github.com/poli0981/jsonPrism)

jobs:
  smoke:
    name: Check production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Wait for this commit to go live
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          want="${SHA:0:7}"
          for attempt in $(seq 1 60); do
            live=$(curl -fsS -A "$UA" --max-time 10 "$SITE/" | sed -n 's/.*<meta name="jsonprism-commit" content="\([0-9a-f]*\)".*/\1/p' | head -n 1 || true)
            if [ "$live" = "$want" ]; then
              echo "Production serves $live"
              exit 0
            fi
            echo "Attempt $attempt: live=${live:-unknown}, waiting for $want"
            sleep 15
          done
          echo "::error::Production did not serve $want within 15 minutes. Check Workers Builds in the Cloudflare dashboard."
          exit 1

      - name: Check headers, routes and API
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          headers=$(curl -fsSI -A "$UA" "$SITE/")
          for expected in "content-security-policy: default-src 'self'" "strict-transport-security: max-age=" "x-content-type-options: nosniff" "x-frame-options: deny"; do
            grep -qi "^$expected" <<<"$headers" || fail "Missing header: $expected"
          done
          [ "$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' "$SITE/about")" = 200 ] || fail "/about is not served by the SPA fallback"
          old=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code} %{redirect_url}' "$SITE/jsonPrism/about")
          [ "$old" = "301 $SITE/about" ] || fail "/jsonPrism/about gave '$old', expected a 301 to /about"
          [ "$(curl -fsS -A "$UA" "$SITE/api/health")" = '{"ok":true,"service":"jsonprism"}' ] || fail "/api/health is not healthy"
          curl -fsS -A "$UA" "$SITE/.well-known/security.txt" | grep -q '^Contact: mailto:security@poli0981.dev' || fail "security.txt is missing or stale"
          code=$(curl -sS -A "$UA" -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://example.com' -H 'Content-Type: application/json' --data '{"token":"x"}' "$SITE/api/turnstile/verify")
          [ "$code" = 403 ] || fail "/api/turnstile/verify answered $code to a foreign origin, expected 403"
          echo "Production checks passed."
