name: Maintenance triage

# JSONPrism is in maintenance mode (CONTRIBUTING.md → Maintenance mode). This
# workflow closes, with a bilingual comment and the `out-of-scope` label:
#   • any issue or pull request the maintainer labels `out-of-scope`;
#   • when opened by an outside contributor: issues titled [FEATURE] or
#     labelled `enhancement`, and pull requests titled `feat:` (any scope
#     except `converter`/`converters`). The owner, members, collaborators and
#     bots are skipped.
# pull_request_target runs in the base repository so it can comment on and
# close pull requests from forks. It never checks out or runs pull request
# code, and the script reads titles from the event payload itself instead of
# having untrusted text interpolated into it.

on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [opened, labeled]

permissions: {}

concurrency:
  group: maintenance-triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Close out-of-scope requests
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'out-of-scope') ||
      (github.event.action == 'opened' &&
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.issue.author_association || github.event.pull_request.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close if out of scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const OUT_OF_SCOPE = 'out-of-scope';
            const TRUSTED = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const { payload } = context;
            const isPR = Boolean(payload.pull_request);
            const item = payload.pull_request ?? payload.issue;
            if (!item || item.state !== 'open') return;

            const labels = (item.labels ?? []).map((label) => label.name);
            let reason = null;
            if (payload.action === 'labeled') {
              if (payload.label?.name === OUT_OF_SCOPE) reason = 'labelled out-of-scope';
            } else if (payload.action === 'opened') {
              const trusted = TRUSTED.includes(item.author_association);
              const bot = item.user?.type === 'Bot';
              const title = String(item.title ?? '').trim();
              if (!trusted && !bot) {
                if (isPR) {
                  // Conventional Commits: feat:, feat(scope):, feat!: — converters stay open.
                  const feat = /^feat(?:\(([^)]*)\))?!?:/i.exec(title);
                  if (feat && !/^converters?$/i.test((feat[1] ?? '').trim())) reason = 'feat: pull request';
                } else if (/^\[feature\]/i.test(title) || labels.includes('enhancement')) {
                  reason = 'feature request';
                }
              }
            }
            if (!reason) {
              core.info(`#${item.number}: within scope, nothing to do.`);
              return;
            }

            const ideas = 'https://github.com/poli0981/jsonPrism/discussions/categories/ideas';
            const policy = 'https://github.com/poli0981/jsonPrism/blob/main/CONTRIBUTING.md#maintenance-mode';
            const en = isPR ? 'pull request' : 'issue';
            const vi = isPR ? 'Pull request' : 'Issue';
            const body = [
              '<!-- maintenance-triage -->',
              'Thanks for taking the time to write this. JSONPrism is in **maintenance mode**: it still takes dependency and security updates, major runtime upgrades, fixes for bugs, UI/UX, accessibility and translations, converter additions or removals that people really need, and Cloudflare or website fixes, but no new features.',
              '',
              `This ${en} falls outside that scope, so it has been closed. If it is actually a bug, an accessibility or translation fix, or a converter request, reply here and the maintainer will take another look. Ideas are welcome in [Discussions → Ideas](${ideas}). The full policy is in [CONTRIBUTING.md → Maintenance mode](${policy}).`,
              '',
              '---',
              '',
              'Cảm ơn bạn đã dành thời gian. JSONPrism đang ở **giai đoạn bảo trì**: vẫn nhận cập nhật thư viện và bảo mật, nâng cấp runtime lớn, sửa lỗi, UI/UX, trợ năng (accessibility) và bản dịch, thêm hoặc bỏ converter khi thật sự có người cần, và sửa lỗi Cloudflare hay website, nhưng không thêm tính năng mới.',
              '',
              `${vi} này nằm ngoài phạm vi đó nên đã được đóng. Nếu thực ra đây là lỗi, sửa trợ năng hay bản dịch, hoặc yêu cầu converter, hãy trả lời tại đây để maintainer xem lại. Ý tưởng có thể gửi ở [Discussions → Ideas](${ideas}). Chính sách đầy đủ: [CONTRIBUTING.md → Maintenance mode](${policy}).`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const number = item.number;
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            if (!labels.includes(OUT_OF_SCOPE)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [OUT_OF_SCOPE] });
            }
            if (isPR) {
              await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: number, state: 'closed', state_reason: 'not_planned' });
            }
            core.notice(`Closed ${en} #${number} as out of scope (${reason}).`);
