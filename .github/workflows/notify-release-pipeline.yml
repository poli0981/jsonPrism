name: Notify Release Pipeline

on:
  workflow_run:
    # Subscribe only to release-pipeline workflows. The previous catch-all
    # ("*") triggered this workflow on every completion (including CI and
    # this workflow itself), most of which immediately skipped.
    workflows: ["Release Tauri bundles", "Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@main
    secrets: inherit
