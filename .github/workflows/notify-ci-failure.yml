name: Notify CI Failures

on:
  workflow_run:
    # Subscribe only to the workflow we actually want failure notifications
    # for. The previous catch-all ("*") triggered this workflow on every
    # completion (deploy, release, notify itself), most of which immediately
    # skipped — adding noise to the Actions tab.
    workflows: ["CI"]
    types: [completed]

# REQUIRED: declare permissions matching the reusable workflow's needs.
# Reusable needs `actions: read` to inspect workflow_run details.
permissions:
  contents: read
  actions: read

jobs:
  notify:
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets: inherit
