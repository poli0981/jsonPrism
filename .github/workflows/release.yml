name: Release Tauri bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft release ONCE, up front, so every platform in the matrix
  # below uploads into the same release. Previously each matrix job ran
  # tauri-action's "find or create release" concurrently; with no release yet,
  # they raced to create it and produced duplicate drafts that split the assets
  # (Linux bundles in one draft, macOS/Windows in another). A single
  # pre-created release referenced by `releaseId` removes the race.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '').replace('refs/heads/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `JSONPrism ${tag}`,
              body: [
                'Native desktop builds for Windows, macOS, and Linux, plus an Android APK (sideload, Android 12+).',
                '',
                'Android: download the `.apk`, then enable "install unknown apps" for your browser/file manager to sideload.',
                '',
                'See the [CHANGELOG](https://github.com/poli0981/jsonPrism/blob/main/CHANGELOG.md) for details.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: Build · ${{ matrix.platform.name }}
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            args: ''
          - name: macOS (universal)
            runner: macos-14
            args: '--target universal-apple-darwin'
          - name: Linux
            runner: ubuntu-22.04
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal2 build needs both aarch64 + x86_64 targets installed.
          targets: ${{ matrix.platform.runner == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons (Linux & macOS)
        if: matrix.platform.runner != 'windows-latest'
        run: npm run tauri:icon

      - name: Generate icons (Windows)
        if: matrix.platform.runner == 'windows-latest'
        run: npm run tauri:icon
        shell: pwsh

      - name: Build, sign, and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into the single draft created by the create-release job above
          # instead of finding/creating one per matrix job (which caused
          # duplicate drafts + split assets). The maintainer un-drafts manually.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  # Android is built separately: tauri-action does not build mobile targets, so
  # this job drives the Tauri CLI directly (Java + Android SDK/NDK + Rust android
  # targets), signs with the release keystore from secrets, and uploads the
  # universal APK into the same draft release as the desktop bundles.
  #
  # Requires these repository secrets (see docs/TAURI-NOTES.md):
  #   ANDROID_KEYSTORE_BASE64    base64 of upload-keystore.jks
  #   ANDROID_KEYSTORE_PASSWORD  the keystore (store) password
  #   ANDROID_KEY_PASSWORD       the key password (optional; defaults to store password)
  #   ANDROID_KEY_ALIAS          the key alias (optional; defaults to "upload")
  android:
    name: Build · Android (APK)
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform + NDK
        run: |
          sdkmanager "platforms;android-36" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust (stable) + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons
        run: npm run tauri:icon

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot sign the release APK."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "storeFile=$KEYSTORE_PATH"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed universal APK
        run: npm run tauri -- android build --apk

      - name: Upload APK to release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '').replace('refs/heads/', '');
            const dir = 'src-tauri/gen/android/app/build/outputs/apk/universal/release';
            const apks = fs.readdirSync(dir).filter((f) => f.endsWith('.apk'));
            if (apks.length === 0) throw new Error(`No APK found in ${dir}`);
            const src = `${dir}/${apks[0]}`;
            const name = `JSONPrism-${tag}-android-universal.apk`;
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name,
              data: fs.readFileSync(src),
            });
            core.info(`Uploaded ${name} from ${src}`);
