name: Release Tauri bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft release ONCE, up front, so every platform in the matrix
  # below uploads into the same release. Previously each matrix job ran
  # tauri-action's "find or create release" concurrently; with no release yet,
  # they raced to create it and produced duplicate drafts that split the assets
  # (Linux bundles in one draft, macOS/Windows in another). A single
  # pre-created release referenced by `releaseId` removes the race.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '').replace('refs/heads/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `JSONPrism ${tag}`,
              body: [
                'Native desktop builds for Windows, macOS, and Linux.',
                '',
                'See the [CHANGELOG](https://github.com/poli0981/jsonPrism/blob/main/CHANGELOG.md) for details.',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: Build · ${{ matrix.platform.name }}
    needs: create-release
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            args: ''
          - name: macOS (universal)
            runner: macos-14
            args: '--target universal-apple-darwin'
          - name: Linux
            runner: ubuntu-22.04
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal2 build needs both aarch64 + x86_64 targets installed.
          targets: ${{ matrix.platform.runner == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons (Linux & macOS)
        if: matrix.platform.runner != 'windows-latest'
        run: npm run tauri:icon

      - name: Generate icons (Windows)
        if: matrix.platform.runner == 'windows-latest'
        run: npm run tauri:icon
        shell: pwsh

      - name: Build, sign, and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into the single draft created by the create-release job above
          # instead of finding/creating one per matrix job (which caused
          # duplicate drafts + split assets). The maintainer un-drafts manually.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}
