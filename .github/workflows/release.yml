name: Release Tauri bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            runner: macos-14
            args: '--target aarch64-apple-darwin'
          - name: macOS (Intel)
            runner: macos-13
            args: '--target x86_64-apple-darwin'
          - name: Linux
            runner: ubuntu-22.04
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.runner == 'macos-14' && 'aarch64-apple-darwin' || matrix.platform.runner == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate icons (Linux & macOS)
        if: matrix.platform.runner != 'windows-latest'
        run: npm run tauri:icon

      - name: Generate icons (Windows)
        if: matrix.platform.runner == 'windows-latest'
        run: npm run tauri:icon
        shell: pwsh

      - name: Build, sign, and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JSONPrism ${{ github.ref_name }}'
          releaseBody: |
            Native desktop builds for Windows, macOS, and Linux.

            See the [CHANGELOG](https://github.com/poli0981/jsonprism/blob/main/CHANGELOG.md) for what's new.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}
