version: 2

# Weekly updates, grouped by package family so a family's majors land together:
# a lone `eslint` major once left `npm ci` broken on main for four months.
# A cooldown skips releases younger than a few days (security updates are exempt).

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, npm]
    ignore:
      # `typescript` is an alias for the TypeScript 6 API that typescript-eslint
      # needs; the compiler itself is TypeScript 7 (`@typescript/native`).
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # @types/node follows the Node major in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      eslint:
        patterns: [eslint, '@eslint/*', typescript-eslint, 'eslint-plugin-*', globals]
      test:
        patterns: [vitest, '@vitest/*', jsdom, '@testing-library/*']
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom', '@vitejs/plugin-react']
      build:
        patterns: [vite, tailwindcss, '@tailwindcss/*', tw-animate-css, prettier, 'prettier-plugin-*', knip]
      i18n:
        patterns: [i18next, react-i18next]
      tauri:
        patterns: ['@tauri-apps/*']
      codemirror:
        patterns: ['@codemirror/*', '@uiw/*', '@lezer/*']
      radix:
        patterns: ['@radix-ui/*']
      cloudflare:
        patterns: [wrangler, '@cloudflare/*', '@marsidev/react-turnstile']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ['*']

  # The Tauri shell. Keep the crate versions in step with the @tauri-apps npm packages.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: [dependencies, rust, tauri]
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*']
      cargo-minor-patch:
        update-types: [minor, patch]
