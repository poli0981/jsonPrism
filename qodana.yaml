# Qodana for JS/TS: Qodana Cloud project "jsonprism-js-ts".
# Runs in native mode from .github/workflows/qodana.yml (job "js").
# The Tauri shell has its own configuration in src-tauri/qodana.yaml.
version: '1.0'
linter: qodana-js

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      # Build output, caches and generated files
      - .wrangler
      - coverage
      - dist
      - node_modules
      - package-lock.json
      - worker-configuration.d.ts
      # Generated by the shadcn CLI; not edited by hand (see CLAUDE.md)
      - src/components/ui
      # Analysed by Qodana for Rust (src-tauri/qodana.yaml)
      - src-tauri
